# 匿名提问箱 · nginx 反向代理
#
# 作用：把 80 端口的请求转发给本机 8080 的 Node 服务
#      —— 这样访问 http://你的域名 就不用带 :8080 了
#
# 安全要点（很重要）：
#   nginx 默认会原样转发客户端发来的自定义头。如果不管，
#   访问者可以自己伪造一个 CF-Connecting-IP 头，而服务端的取值逻辑
#   优先信任它 —— 于是每个请求都能换一个"假 IP"，限流彻底失效。
#   所以下面把 CF-Connecting-IP 清空，并用 $remote_addr 覆盖
#   X-Forwarded-For（而不是 $proxy_add_x_forwarded_for，后者会保留
#   客户端伪造的历史值）。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 写真实域名，certbot 才能找到匹配的 server 块来签证书。
    # 保留 default_server，所以用 IP 直接访问也能命中这里。
    server_name your-name.duckdns.org;

    # 请求体上限：本站最大也就几 KB 的 JSON，给 1MB 足够
    client_max_body_size 1m;

    # 隐藏 nginx 版本号
    server_tokens off;

    access_log /var/log/nginx/anon-ask.access.log;
    error_log  /var/log/nginx/anon-ask.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # ---- 真实 IP 传递（安全关键）----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 用 $remote_addr 直接覆盖，不追加，杜绝客户端伪造的历史值
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 的头在这里必须清空 —— 我们前面没有 Cloudflare，
        # 客户端发来的都是伪造的
        proxy_set_header CF-Connecting-IP  "";

        # 清掉可能被伪造的其它转发头
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Forwarded-Port  "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

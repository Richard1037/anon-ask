<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>我的提问 · 匿名提问箱</title>
<meta name="theme-color" content="#5a5cf0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">

  <header class="hero">
    <span class="hero__eyebrow">私密页面</span>
    <h1 class="hero__title">我的提问</h1>
    <p class="hero__desc">这个页面只在你自己的浏览器里有记录，别人打不开。</p>
  </header>

  <div class="alert alert--error" id="pageError" hidden></div>
  <div class="alert alert--info" id="pageInfo" hidden></div>

  <div id="historyView" hidden>
    <div class="section-title">本机保存的提问</div>
    <div class="history" id="historyList"></div>
    <div class="empty" id="historyEmpty" hidden>
      这台设备上还没有提交过提问。
    </div>
  </div>

  <div id="detailView" hidden>
    <section class="card">
      <div class="card__body">
        <div class="qa__meta" id="qMeta"></div>
        <p class="qa__content" id="qContent"></p>
        <div class="followups" id="qFollowups" hidden></div>
      </div>
    </section>

    <section class="card" id="answerCard" hidden>
      <div class="card__body">
        <div class="section-title">站长的回答</div>
        <p class="qa__answer" id="qAnswer"></p>
      </div>
    </section>

    <section class="card" id="waitingCard" hidden>
      <div class="card__body">
        <div class="empty">站长还没有回答这条提问。可以再等等，或者补充点信息。</div>
      </div>
    </section>

    <section class="card">
      <div class="card__body">
        <div class="section-title">补充说明</div>
        <div class="alert alert--error" id="followupError" hidden></div>
        <form id="followupForm">
          <div class="field">
            <textarea class="textarea" id="followupContent" rows="3"
              placeholder="想补充背景、追问，或者说明一下？" required></textarea>
            <div class="counter" id="followupCounter">0 / 500</div>
          </div>
          <div class="btn-row">
            <button class="btn btn--primary" id="followupBtn" type="submit">提交补充</button>
          </div>
        </form>
      </div>
    </section>

    <div class="btn-row">
      <a class="btn btn--sm" href="/my">← 我提过的其他问题</a>
      <a class="btn btn--sm" href="/">去提问墙</a>
    </div>
  </div>

  <footer class="footer">
    <p><a href="/">返回提问墙</a></p>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/mine.js" defer></script>
</body>
</html>

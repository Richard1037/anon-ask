<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>匿名提问箱</title>
<meta name="description" content="匿名提问，无需登录。">
<meta name="theme-color" content="#5a5cf0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">

  <header class="hero">
    <span class="hero__eyebrow">完全匿名 · 无需登录</span>
    <h1 class="hero__title" id="siteName">匿名提问箱</h1>
    <p class="hero__desc" id="siteDesc">有什么想问的，匿名写下来吧。</p>
  </header>

  <section class="card" aria-label="提问表单">
    <div class="card__body">
      <div class="alert alert--error" id="formError" hidden></div>

      <form id="askForm" novalidate>
        <div class="field">
          <label class="label" for="content">你想问什么？</label>
          <textarea class="textarea" id="content" name="content" rows="5"
            placeholder="想到什么就写什么。不用顾忌，我会认真回答。" required></textarea>
          <div class="counter" id="contentCounter">0 / 800</div>
        </div>

        <div class="row">
          <div class="field">
            <label class="label" for="nickname">昵称（可选）</label>
            <input class="input" id="nickname" name="nickname" type="text"
              placeholder="留空就是「匿名」" autocomplete="off">
          </div>
          <div class="field">
            <label class="label" for="tag">话题（可选）</label>
            <input class="input" id="tag" name="tag" type="text"
              placeholder="例如：学业" autocomplete="off">
          </div>
        </div>

        <div class="honeypot" aria-hidden="true">
          <label for="website">网址</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="btn-row">
          <button class="btn btn--primary btn--block" id="submitBtn" type="submit">匿名提交</button>
        </div>

        <p class="hint">
          提交后这条提问默认只有站长可见。系统会给你一条私密回执链接，
          站长如果选择「单独回答」，只有凭那条链接才能看到回答，请务必保存。
        </p>
      </form>

      <div class="receipt" id="receipt" hidden>
        <p class="receipt__title">提交成功</p>
        <p class="receipt__hint">
          请保存好这条回执链接。它是你查看回答的唯一凭据，丢了就无法找回。
        </p>
        <div class="copybox">
          <input class="input" id="receiptUrl" type="text" readonly aria-label="回执链接">
          <button class="btn btn--primary" id="copyBtn" type="button">复制</button>
        </div>
        <div class="btn-row">
          <a class="btn btn--sm" id="receiptOpen" href="#">查看这条提问</a>
        </div>
      </div>
    </div>
  </section>

  <h2 class="section-title">公开问答</h2>
  <div class="wall" id="wall"></div>
  <div class="empty" id="wallEmpty" hidden>还没有公开的回答，来做第一个提问的人吧。</div>
  <div class="btn-row">
    <button class="btn btn--ghost btn--block" id="loadMore" type="button" hidden>加载更多</button>
  </div>

  <footer class="footer">
    <p><a href="/my">我提过的问题</a> · <a href="/admin">管理入口</a></p>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
